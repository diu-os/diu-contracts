[package]
name = "diu-contracts"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["DIU OS Team"]
description = "DIU OS Smart Contracts — Arbitrum Stylus"

[dependencies]
stylus-sdk = "0.10.0"
alloy-primitives = "1.3"
alloy-sol-types = "1.3"

# Pin transitive dep to avoid semver-incompatible resolution with alloy-consensus 1.0.x
alloy-tx-macros = "=1.0.41"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
stylus-sdk = { version = "0.10.0", features = ["stylus-test"] }

[features]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
reputation = []
achievements = []
token = []
registry = []
progress = []

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "diu-contracts"
path = "src/main.rs"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
